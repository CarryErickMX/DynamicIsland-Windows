# Compila el .exe y el instalador, y crea un Release en GitHub
# cada vez que subes una etiqueta v*.   Ejemplo:
#   git tag v1.1.0  &&  git push origin v1.1.0
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Versión y arquitectura
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+') { $v = "1.0.0" }
          $arch = "${{ matrix.rid }}" -replace '^win-', ''
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ARCH=$arch" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publicar .exe
        run: >
          dotnet publish src/DynamicIsland/DynamicIsland.csproj
          -c Release -r ${{ matrix.rid }}
          -p:Version=${{ env.VERSION }}
          -o publish/${{ env.ARCH }}

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Crear instalador
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyVersion=${{ env.VERSION }}" `
            "/DMyArch=${{ env.ARCH }}" `
            "/DMySource=$PWD\publish\${{ env.ARCH }}" `
            installer\DynamicIsland.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Empaquetar versión portable
        shell: pwsh
        run: |
          Copy-Item "publish/${{ env.ARCH }}/DynamicIsland.exe" "DynamicIsland.exe"
          Compress-Archive -Path "DynamicIsland.exe" -DestinationPath "dist/DynamicIsland-Portable-${{ env.ARCH }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-${{ env.ARCH }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
